name: Bridge release integration CI
on:
  push:
    branches: ['bridge/release-integration']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Offline policy, provenance, snapshot and orchestration tests
        run: python3 -m unittest discover -s scripts/bridge -p 'test_*.py' -v
      - name: Validate workflow contracts and Bash syntax
        run: |
          python3 -m venv validation-env
          validation-env/bin/pip install PyYAML==6.0.3
          validation-env/bin/python scripts/bridge/check_workflows.py
