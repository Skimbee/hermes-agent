name: Bridge independent evidence gate
on:
  workflow_run:
    workflows: ['Bridge hourly integration pilot']
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: 'Completed hourly integration run ID'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    if: github.repository == 'Skimbee/hermes-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify run, artifact, controls and Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.workflow_run.id || inputs.candidate_run }}
        run: python3 scripts/bridge/release_check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-gate-${{ github.run_id }}
          path: gate-result.json
          if-no-files-found: error
          retention-days: 7
