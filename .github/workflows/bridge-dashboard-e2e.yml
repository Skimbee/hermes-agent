name: Bridge isolated Dashboard E2E
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        type: string
        required: true
  workflow_run:
    workflows: ['Bridge hourly integration pilot']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: container-dashboard-e2e
  cancel-in-progress: false
jobs:
  dashboard:
    if: github.repository == 'Skimbee/hermes-agent' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify local contracts and prepare authenticated candidate
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.workflow_run.id || inputs.candidate_run }}
        run: |
          python3 -m unittest discover -s scripts/bridge -p 'test_*.py' -v
          python3 scripts/bridge/container-e2e/prepare.py
      - name: Build trusted toolchain without candidate sources
        if: steps.prepare.outputs.no_change != 'true'
        run: docker build --tag bridge-e2e-toolchain:local scripts/bridge/container-e2e
      - name: Install trusted external browser controller
        if: steps.prepare.outputs.no_change != 'true'
        run: |
          python3 -m venv controller-env
          controller-env/bin/pip install playwright==1.55.0
          controller-env/bin/python -m playwright install --with-deps chromium
      - name: Real browser update with external offline snapshot inspection
        if: steps.prepare.outputs.no_change != 'true'
        run: controller-env/bin/python scripts/bridge/container-e2e/controller.py
      - name: Preserve external result and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/result.json
            evidence/install-diagnostic.txt
            evidence/dashboard-diagnostic.txt
            e2e-input/binding.json
            e2e-input/original-receipt.json
          retention-days: 7
          if-no-files-found: warn
