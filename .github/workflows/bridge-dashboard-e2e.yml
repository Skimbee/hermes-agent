name: Bridge isolated Dashboard update E2E
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: 'Successful hourly integration run ID'
        required: true
        default: '34761194950'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  dashboard:
    if: github.repository == 'Skimbee/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Obtain previously tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          attempt=$(gh api "repos/Skimbee/hermes-agent/actions/runs/$CANDIDATE_RUN" --jq .run_attempt)
          gh run download "$CANDIDATE_RUN" --repo Skimbee/hermes-agent --name "bridge-candidate-$CANDIDATE_RUN-$attempt" --dir input
      - name: Prepare disposable installation
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Skimbee/hermes-agent.git source
          git -C source bundle verify ../input/candidate.bundle
          git -C source fetch ../input/candidate.bundle HEAD
          target=$(python3 -c 'import json,re; r=json.load(open("input/receipt.json")); assert re.fullmatch("[0-9a-f]{40}",r["candidate"]); print(r["candidate"])')
          test "$(git -C source rev-parse FETCH_HEAD)" = "$target"
          git clone --bare source fixture-origin.git
          git --git-dir=fixture-origin.git update-ref refs/heads/main d131988d53c3b8389801f6cee03b990bd51ac49a
          git --git-dir=fixture-origin.git symbolic-ref HEAD refs/heads/main
          git clone fixture-origin.git client
          git --git-dir=fixture-origin.git update-ref refs/heads/main "$target"
          cd client
          uv sync --frozen --python 3.11 --extra web --extra hindsight
          npm ci
          npm run build --workspace web
          cd ..
          uv venv controller
          uv pip install --python controller/bin/python playwright==1.55.0
          controller/bin/python -m playwright install --with-deps chromium
      - name: Exercise real Dashboard browser update
        run: controller/bin/python scripts/bridge/dashboard_e2e.py
      - name: Upload bounded E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
