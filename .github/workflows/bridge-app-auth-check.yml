name: Bridge App read-only authentication check
on:
  workflow_dispatch:
permissions: {}
jobs:
  authenticate:
    if: github.repository == 'Skimbee/hermes-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: bridge-publisher
    steps:
      - name: Mint repository-scoped read-only token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIDGE_APP_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: Skimbee
          repositories: hermes-agent
          permission-contents: read
          permission-pull-requests: read
          skip-token-revoke: false
      - name: Check repository scope and protected branch without writes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          def get(path):
              request=urllib.request.Request('https://api.github.com/'+path,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  return json.load(response)
          scope=get('installation/repositories?per_page=100')
          names=[r['full_name'] for r in scope['repositories']]
          assert scope['total_count']==1 and names==['Skimbee/hermes-agent'], 'Unexpected token repository scope'
          branch=get('repos/Skimbee/hermes-agent/branches/main')
          assert branch['protected'] is True, 'Main protection is absent'
          pulls=get('repos/Skimbee/hermes-agent/pulls?state=open&per_page=1')
          assert isinstance(pulls,list)
          print(json.dumps({'app_authentication':'passed','token_scope':names,'main_protected':True,'main_sha':branch['commit']['sha'],'git_writes':False,'pull_request_writes':False}))
          PY
