name: Bridge hourly integration pilot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      rehearsal:
        description: 'Controlled failure rehearsal (normal for routine runs)'
        type: choice
        default: normal
        options:
          - normal
          - merge-conflict
          - test-failure
permissions:
  contents: read
concurrency:
  group: bridge-hourly-pilot
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Skimbee/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Exercise real merge conflict in disposable repository
        if: inputs.rehearsal == 'merge-conflict'
        shell: bash
        run: |
          set -euo pipefail
          mkdir conflict-fixture
          cd conflict-fixture
          git init -b base
          git config user.name 'Bridge rehearsal'
          git config user.email 'hermes-agent@users.noreply.github.com'
          printf 'base\n' > conflict.txt
          git add conflict.txt
          git commit -m base
          git checkout -b incoming
          printf 'upstream\n' > conflict.txt
          git commit -am incoming
          git checkout base
          printf 'local\n' > conflict.txt
          git commit -am local
          git merge incoming
      - name: Build isolated candidate without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Skimbee/hermes-agent.git candidate
          cd candidate
          git config user.name 'Bridge integration pilot'
          git config user.email 'hermes-agent@users.noreply.github.com'
          git checkout --detach "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > ../candidate-base.txt
          git merge --no-edit 2f542d949e5729586c6163d027d54c8931fd7cf6
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          printf '### Read-only integration pilot\n\nBase: `%s`\n\nUpstream: `%s`\n' "$(git rev-parse HEAD)" "$(git rev-parse upstream/main)" >> "$GITHUB_STEP_SUMMARY"
          git merge --no-edit upstream/main
          printf '\nCandidate: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install and verify frozen SDK contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install uv==0.11.26
          cd candidate
          uv lock --check
          uv sync --frozen --extra hindsight --extra dev
          uv pip install --python .venv/bin/python pytest-asyncio==1.3.0
          .venv/bin/python -c 'from importlib.metadata import version; assert version("hindsight-client") == "0.9.2"'
      - name: Run focused regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          bash scripts/run_tests.sh tests/plugins/memory/test_hindsight_pin_contract.py tests/plugins/memory/test_hindsight_provider.py tests/test_packaging_metadata.py tests/tools/test_lazy_deps.py tests/tools/test_lazy_deps_managed.py tests/tools/test_lazy_deps_durable_target.py tests/hermes_cli/test_update_upstream_prompt_noninteractive.py
      - name: Exercise failing assertion
        if: inputs.rehearsal == 'test-failure'
        run: python3 -c 'assert False, "Intentional failure rehearsal; no publication allowed"'
      - name: Preserve exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          cd candidate
          base=$(cat ../candidate-base.txt)
          git diff --exit-code HEAD
          git merge-base --is-ancestor "$base" HEAD
          git bundle create ../evidence/candidate.bundle "$base"..HEAD
          git bundle verify ../evidence/candidate.bundle
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = pathlib.Path('../candidate-base.txt').read_text().strip()
          changed = git('diff', '--name-only', base, 'HEAD').splitlines()
          controls = [p for p in changed if p.startswith(('.github/', 'scripts/'))]
          receipt = dict(schema=1, base=base, candidate=git('rev-parse','HEAD'),
              upstream=git('rev-parse','upstream/main'), run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], workflow_sha=os.environ['GITHUB_SHA'],
              bundle_sha256=hashlib.sha256(pathlib.Path('../evidence/candidate.bundle').read_bytes()).hexdigest(),
              control_changes=controls, publication_enabled=False, dashboard_e2e=False)
          pathlib.Path('../evidence/receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY
      - name: Upload candidate and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
      - name: State pilot boundary
        if: always()
        run: |
          printf '\nPilot only: no branch publication, no production changes, no Hindsight records. Native Dashboard E2E is a separate gate.\n' >> "$GITHUB_STEP_SUMMARY"
  notify:
    needs: verify
    if: always() && needs.verify.result == 'failure' && github.repository == 'Skimbee/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update one failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Skimbee/hermes-agent
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title='Bridge hourly pilot: integration needs attention'
          number=$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Bridge hourly pilot: integration needs attention") | .number' | sort -n | head -n 1)
          body="Hourly read-only integration failed. No release branch was updated. Inspect: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
